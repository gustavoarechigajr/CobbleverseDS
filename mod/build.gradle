plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon is always present in the Cobbleverse pack; compile against the exact jar it ships.
	modCompileOnly files('libs/Cobblemon-fabric-1.7.3+1.21.1.jar')
	compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
	runs {
		client {
			// Debug endpoints (give items, run commands, open worlds) for the integration tests.
			vmArg '-Dcvds.debug=true'
			programArgs '--quickPlaySingleplayer', 'cvds-test'
		}
	}
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
