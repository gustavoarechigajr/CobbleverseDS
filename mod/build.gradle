plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	mavenCentral()
	// Cobblemon and Tom's Simple Storage, exactly the builds shipped in the Cobbleverse pack
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compile-only: the pack provides them at runtime. Versions are Modrinth version ids of
	// Cobblemon 1.7.3+1.21.1 (kF7CvxTo) and Tom's Simple Storage 1.21-2.3.0-fabric (GwLz79tK).
	modCompileOnly 'maven.modrinth:MdwFAVRL:kF7CvxTo'
	modCompileOnly 'maven.modrinth:XZNI4Cpy:GwLz79tK'
	compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
	runs {
		client {
			// Debug endpoints (give items, run commands, open worlds) for the integration tests.
			vmArg '-Dcvds.debug=true'
		}
	}
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
