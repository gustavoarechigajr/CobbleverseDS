<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240, user-scalable=no">
<title>Cobbleverse DS</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="status">
  <div id="lens" aria-hidden="true"></div>
  <div id="leds" title="Green: connected · yellow: waiting for a world · red: game not reachable"><i class="led r"></i><i class="led y"></i><i class="led g"></i></div>
  <div id="st-text"><span id="st-main">Waiting for the game…</span><span id="st-side"></span></div>
</header>
<div id="app">
  <nav id="tabs">
    <button data-tab="storage" class="on"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12v2H2zM1 6h14v8H1zM7 8h2v3H7z"/></svg><span>Storage</span></button>
    <button data-tab="craft"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h3v3H2zM6.5 2h3v3h-3zM11 2h3v3h-3zM2 6.5h3v3H2zM6.5 6.5h3v3h-3zM11 6.5h3v3h-3zM2 11h3v3H2zM6.5 11h3v3h-3zM11 11h3v3h-3z"/></svg><span>Craft</span></button>
    <button data-tab="keys"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h6v6H2zM4 7h2v2H4zM8 7h7v2H8zM12 9h2v3h-2zM9 9h2v2H9z"/></svg><span>Keys</span></button>
    <button data-tab="party"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6v1h2v2h1v3H2V4h1V2h2zM2 9h12v3h-1v2h-2v1H5v-1H3v-2H2zM6 6h4v4H6zM7 7h2v2H7z"/></svg><span>Party</span></button>
    <button data-tab="pc"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2h14v9H1zM3 4h10v5H3zM6 12h4v1H6zM4 13h8v2H4z"/></svg><span>PC</span></button>
    <button data-tab="battle"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1h4l-3 5h3l-6 9 1-6H5z"/></svg><span>Battle</span></button>
    <button data-tab="spawns"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14h12v1H2zM3 9h2v5H3zM6 6h2v8H6zM9 8h2v6H9zM12 10h1v4h-1zM4 7h1v2H4zM8 4h1v2H8zM11 6h1v2h-1z"/></svg><span>Spawns</span></button>
    <button data-tab="chat"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2h14v9H7l-4 3v-3H1zM4 5h8v1H4zM4 7h6v1H4z"/></svg><span>Chat</span></button>
  </nav>
  <main>
    <section id="tab-storage" class="tab on">
      <div class="bar">
        <div class="seg" id="modes">
          <button data-mode="move" class="on">Move</button>
          <button data-mode="half">Half</button>
          <button data-mode="one">One</button>
          <button data-mode="quick">Quick</button>
          <button data-mode="hotbar">Hotbar</button>
        </div>
        <input id="inv-search" type="search" placeholder="Find item" autocomplete="off">
      </div>
      <div class="bar" id="bulk">
        <button data-bulk="take">Take all</button>
        <button data-bulk="store">Store all</button>
        <button data-bulk="matching">Store matching</button>
        <button data-bulk="sortc">Sort container</button>
        <button data-bulk="sortp">Sort inventory</button>
      </div>
      <div class="bar hidden" id="selbar">
        <span id="sel-name"></span>
        <button data-sel="all-like">Move all like this</button>
        <button data-sel="drop1">Drop 1</button>
        <button data-sel="drop">Drop stack</button>
        <button data-sel="cancel">Cancel</button>
      </div>
      <div class="bar hidden" id="hotbarbar"></div>
      <div id="net" class="hidden">
        <div class="bar">
          <input id="net-search" type="search" placeholder="Search the storage network" autocomplete="off">
          <select id="net-sort"><option value="count">Most first</option><option value="name">A–Z</option></select>
          <span id="net-info" class="note"></span>
        </div>
        <div id="net-grid"></div>
        <div class="note">Tap = take a stack · hold = take one · in your inventory below, tap Quick (or hold an item) to store it</div>
      </div>
      <div id="grid-wrap"><div id="screen-title"></div><div id="grid"></div></div>
    </section>
    <section id="tab-craft" class="tab">
      <div class="bar"><input id="craft-search" type="search" placeholder="Search recipes (empty = what you can make now)" autocomplete="off"></div>
      <div id="craft-note" class="note"></div>
      <div id="recipes" class="cards"></div>
    </section>
    <section id="tab-keys" class="tab">
      <div class="bar"><input id="key-search" type="search" placeholder="Filter keybinds" autocomplete="off"><button id="key-refresh">Reload</button></div>
      <h3>Favourites <small>(tap ☆ to add)</small></h3>
      <div id="key-favs" class="keys"></div>
      <div id="key-list"></div>
    </section>
    <section id="tab-party" class="tab">
      <div id="party" class="party"></div>
      <div class="bar"><button id="party-send" class="big">Send out / recall selected</button><span class="note">Tap to select · tap ⇅ then another slot to reorder</span></div>
    </section>
    <section id="tab-pc" class="tab">
      <div class="bar">
        <button id="pc-prev" class="nav">◀</button>
        <select id="pc-box"></select>
        <button id="pc-next" class="nav">▶</button>
        <input id="pc-search" type="search" placeholder="Search all boxes: name, type, shiny" autocomplete="off">
      </div>
      <div id="pc-note" class="note"></div>
      <div id="pc-results" class="chips hidden"></div>
      <div id="pc-main">
        <div id="pc-grid"></div>
        <div id="pc-party"></div>
        <div id="pc-detail" class="note">Tap a Pokémon to see details. Tap one, then tap another slot to move or swap them.</div>
      </div>
      <div class="bar">
        <select id="pc-sortmode"></select>
        <button id="pc-sort">Sort box</button>
        <button id="pc-release" class="danger hidden">Release</button>
      </div>
    </section>
    <section id="tab-battle" class="tab">
      <div id="b-sides"></div>
      <div id="b-note" class="note"></div>
      <div id="b-moves"></div>
      <h3 id="b-switch-h">Switch</h3>
      <div id="b-bench" class="chips"></div>
    </section>
    <section id="tab-spawns" class="tab">
      <div class="bar">
        <button id="sp-refresh">Check here</button>
        <label class="note"><input id="sp-missing" type="checkbox"> Only not caught</label>
        <span id="sp-where" class="note"></span>
      </div>
      <div id="sp-list"></div>
    </section>
    <section id="tab-chat" class="tab">
      <div id="chat-log"></div>
      <div id="quick-cmds" class="chips"></div>
      <div class="bar"><input id="chat-input" type="text" placeholder="Chat or /command" autocomplete="off"><button id="chat-send" class="big">Send</button><button id="chat-save">☆</button></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
